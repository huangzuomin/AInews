# 实体注册表（Entity Registry）
#
# 用途：GEO 的长期复利所在 —— AI 引擎建立知识图谱靠的是"实体名一致 + 同一实体跨页共现"。
#       现状是 16,237 个未归一化的标签（例如 `ai-agent与自主系统` 与
#       `ai-agent与自主系统-ai-agents--autonomous-systems` 并存），无法形成实体。
#
# 契约：
#   1. 文章 frontmatter 的 `entities: []` 必须取自本表的 canonical 值（闭集校验）
#   2. `main_topics: []` 必须取自本表的 topic 闭集（见 topics.yaml 或本文档末尾）
#   3. aliases 用于把历史碎片标签归并到 canonical
#
# 字段：
#   canonical     规范名（写入 frontmatter 的值）
#   aliases       同义写法（用于归并、检索与匹配）
#   type          Organization | Product | SoftwareApplication | DefinedTerm | Person | Event
#   official_url  一手源入口（用于来源白名单与 sameAs）
#   same_as       外部知识库对齐（Wikidata / 维基 / GitHub）
#   topic         归属主话题（闭集之一）

