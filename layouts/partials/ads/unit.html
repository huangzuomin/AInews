{{- $slot := .slot -}}
{{- $cls := .cls | default "ad-slot" -}}
{{- $client := "" -}}
{{- with site.Params.adsense -}}{{- $client = .client -}}{{- end -}}
<!--ADDEBUG client=[{{ $client }}] slot=[{{ $slot }}]-->
{{- if and $client $slot -}}
<div class="{{ $cls }}" aria-hidden="true" role="complementary">
  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="{{ $client }}"
       data-ad-slot="{{ $slot }}"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
  <script>
    (adsbygoogle = window.adsbygoogle || []).push({});
  </script>
</div>
{{- end -}}
